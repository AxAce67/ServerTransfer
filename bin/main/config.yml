# ==========================================
# ServerTransfer - Configuration
# ==========================================

# Default language for chat messages: en (English) / ja (Japanese)
language: en

# Title of the selection GUI (Supports color codes with &)
gui-title: "&1Server Selector"

# Initial size of the GUI (Must be 9, 18, 27, 36, 45, or 54)
gui-size: 9

# ------------------------------------------
# Advanced Features
# ------------------------------------------

# Enable/Disable server status (Online/Offline) check
show-status: true

# Enable/Disable real-time player count display (e.g., 15/100)
show-player-count: true

# Time in seconds for teleport countdown (0 to disable)
# Players will be cancelled if they move during this time.
countdown-time: 3

# Text displayed above the status in the item lore
status-separator: "&7----------------"

# ------------------------------------------
# Join Item Settings
# ------------------------------------------

# If true, gives an item to players when they join the server
give-join-item: false

# Material for the join item
join-item-material: "COMPASS"

# Slot to place the item (0-8)
join-item-slot: 8

# Display name of the join item
join-item-name: "&b&lServer Menu &7(Right Click)"

# ------------------------------------------
# Servers List (Editable via /st setting)
# ------------------------------------------
# Each server entry requires:
# - address: "hostname" or "hostname:port"
# - permission: (Optional) Permission required to see/use this server
# - lore: List of descriptions
servers: {}