# ServerTransfer configuration
# Text supports MiniMessage (<green>, <bold>, <#55ffff>, ...) and legacy & colour codes.
# Changes take effect after /st reload.

config-version: 2

# Message language: auto (each player's game language), en, ja
language: auto

menu:
  title: "<dark_gray>Server Selector"
  # Height of the menu, 1-6. It grows automatically when a server's slot does not fit.
  rows: 1
  # Item for empty slots, e.g. GRAY_STAINED_GLASS_PANE. Leave empty for none.
  filler: ""
  # Show whether each server is online, and how many players it has.
  show-status: true
  show-players: true

status:
  # How long a ping result is reused.
  refresh-seconds: 5
  timeout-ms: 1500

transfer:
  # Countdown before the transfer, 0 to transfer immediately.
  countdown-seconds: 3
  cancel-on-move: true
  cancel-on-damage: true
  # Ping the target first and refuse to transfer if it does not answer.
  check-online: true
  # Minimum time between two transfers of the same player.
  cooldown-seconds: 3

# An item in the hotbar that opens the menu.
join-item:
  enabled: false
  material: COMPASS
  # Hotbar slot, 0-8
  slot: 8
  name: "<aqua><bold>Server Menu</bold> <gray>(Right click)"
  lore: []
  # Players cannot drop or move it, and do not lose it on death.
  locked: true

# Target servers must set accepts-transfers=true in server.properties.
#
# servers:
#   lobby:
#     address: "lobby.example.com"     # host or host:port
#     name: "<green>Lobby"
#     icon: GRASS_BLOCK
#     slot: 0                          # optional, the next free slot is used otherwise
#     lore:
#       - "<gray>Players: {online}/{max}"
#       - "<yellow>Click to join"
#     permission: ""                   # optional; players without it do not see the server
#
# Placeholders in name and lore: {online} {max} {ping}
# Servers can also be added in game with /st add and arranged with /st edit.
servers: {}
