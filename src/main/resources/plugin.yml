name: ServerTransfer
version: 1.0
main: me.aki.serverTransfer.ServerTransfer
api-version: '1.20'
prefix: "[ST]"
commands:
  st:
    description: Open the Server Selector GUI
    aliases: [servertransfer, setting]

permissions:
  servertransfer.use:
    description: Allows players to use the server selector.
    default: true
  servertransfer.admin:
    description: Allows use of reload and setting commands.
    default: op