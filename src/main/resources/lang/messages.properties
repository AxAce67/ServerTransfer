# ServerTransfer messages (MiniMessage). To change a message, create
# plugins/ServerTransfer/lang/messages_en.properties with only the keys you want to override.

error.no-permission=<red>You do not have permission to do that.
error.player-only=<red>Only players can do that.
error.unknown-server=<red>Unknown server: <white>{0}</white>. See <yellow>/st list</yellow>.
error.bad-selector=<red>Invalid player or selector: <white>{0}
error.no-players=<red>No players matched <white>{0}</white>.

menu.no-servers=<gray>No servers are set up yet. Admins can add one with <yellow>/st add</yellow>.
menu.no-visible=<gray>There are no servers you can join.
menu.status.checking=<gray>● Checking...
menu.status.online=<green>● Online
menu.status.online-players=<green>● Online <dark_gray>·</dark_gray> <gray>{0}/{1} players
menu.status.offline=<red>● Offline

transfer.checking=<gray>Connecting to {0}<gray>...
transfer.offline=<red>{0} <red>is offline. Try again later.
transfer.countdown=<yellow>Moving to {1} <yellow>in <white>{0}</white>s <gray>(do not move)
transfer.sending=<green>Moving to {0}<green>...
transfer.already=<red>You are already being moved to another server.
transfer.cooldown=<red>Please wait {0}s before moving again.
transfer.cancelled-move=<red>Cancelled because you moved.
transfer.cancelled-damage=<red>Cancelled because you took damage.

list.header=<gray>Servers ({0})
list.online=<green>●</green> {0} <gray>{1}/{2} · {3} ms
list.offline=<red>●</red> {0} <gray>offline
list.hover=<gray>Click to join <white>{0}</white><newline><dark_gray>{1}

send.done=<green>Sending {0} player(s) to {1}<green>.

add.done=<green>Added <white>{0}</white> ({1}). Arrange it with <yellow>/st edit</yellow>, or edit config.yml for its name and lore.
add.bad-id=<red>Invalid id <white>{0}</white>. Use up to 32 lowercase letters, digits, - or _, and not a command name.
add.exists=<red>A server called <white>{0}</white> already exists.
add.bad-address=<red>Invalid address <white>{0}</white>: {1}
add.bad-slot=<red>Invalid slot <white>{0}</white>. Use 0-53.
add.slot-used=<red>Slot {0} is already used.

remove.done=<green>Removed <white>{0}</white>.

editor.title=Drag to arrange · close to save
editor.hint=<gray>Drag the icons into place, then close the menu to save.
editor.saved=<green>Layout saved.
editor.too-small=<red>{0} servers need at least {1} rows.

reload.done=<green>Reloaded. {0} server(s).
reload.warnings=<yellow>Reloaded with {1} warning(s), see the console. {0} server(s).

usage.send=<red>Usage: /st send <player|@a> <server>
usage.add=<red>Usage: /st add <id> <address> [slot]
usage.remove=<red>Usage: /st remove <server>
usage.edit=<red>Usage: /st edit [rows 1-6]

